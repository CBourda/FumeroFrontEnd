<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Fumero</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #112240; --gold: #C19A4F; }

    body {
      background: var(--navy);
      color: #e8e8e8;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(193,154,79,0.2);
      border-radius: 6px;
      padding: 48px;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 32px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a0a8b8;
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 24px;
      transition: border-color 0.2s;
    }

    input[type="password"]:focus {
      border-color: var(--gold);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 3px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-reset {
      background: var(--gold);
      color: var(--navy);
      margin-bottom: 12px;
    }

    .message {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 3px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }

    .message.success {
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.4);
      color: #7ee787;
      display: block;
    }

    .message.error {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: #f87171;
      display: block;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Pannello Admin</h1>

  <label for="pwd">Password</label>
  <input type="password" id="pwd" placeholder="••••••••••" />

  <button class="btn btn-reset" id="btnReset1" onclick="resetSlot(1)">
    Reset Slot 18:00
  </button>
  <button class="btn btn-reset" id="btnReset2" onclick="resetSlot(2)" style="margin-bottom:12px">
    Reset Slot 18:30
  </button>
  <button class="btn btn-reset" id="btnResetAll" onclick="resetAll()" style="background:rgba(193,154,79,0.3);color:#e8e8e8">
    Reset Tutti gli Slot
  </button>

  <div class="message" id="msg"></div>
</div>

<script>
  const API = 'https://fumerobackend.onrender.com'

async function callReset(endpoint, btnId) {
  const pwd = document.getElementById('pwd').value
  const btn = document.getElementById(btnId)
  const msg = document.getElementById('msg')
  if (!pwd) { showMsg('Inserisci la password.', 'error'); return }
  btn.disabled = true
  msg.className = 'message'
  try {
    const res = await fetch(`${API}${endpoint}`, {
      method: 'POST', headers: { 'X-Admin-Password': pwd }
    })
    const data = await res.json()
    if (res.ok) { showMsg('✓ ' + data.message, 'success'); document.getElementById('pwd').value = '' }
    else showMsg(data.message || 'Errore.', 'error')
  } catch { showMsg('Errore di connessione.', 'error') }
  finally { btn.disabled = false }
}

function resetSlot(n) { callReset(`/api/admin/reset-slot${n}`, `btnReset${n}`) }
function resetAll() { callReset('/api/admin/reset-slots', 'btnResetAll') }

function showMsg(text, type) {
  const msg = document.getElementById('msg')
  msg.textContent = text
  msg.className = 'message ' + type
}

document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') resetAll()
})
</script>

</body>
</html>
